[build]
publish = "public"
command = "hugo --minify"

# Shared by production, deploy previews, and branch deploys.
[build.environment]
HUGO_VERSION = "0.166.0"
HUGO_ENVIRONMENT = "production"
HUGO_ENABLEGITINFO = "true"

# Preview future-dated lessons without publishing drafts.
[context.deploy-preview]
command = 'hugo --minify --buildFuture --baseURL "$DEPLOY_PRIME_URL"'

[context.branch-deploy]
command = 'hugo --minify --baseURL "$DEPLOY_PRIME_URL"'
